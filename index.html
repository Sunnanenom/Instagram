<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>กิจกรรมแจกเพชรฟรี 5,100 💎</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Kanit", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #172554 0%, transparent 45%),
        linear-gradient(135deg, #050816, #0b1026 55%, #050816);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 25px;
      padding: 25px 20px 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 35px rgba(37, 99, 235, 0.15);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: #2563eb;
      filter: blur(100px);
      opacity: .18;
      top: -80px;
      right: -60px;
    }

    .badge {
      position: relative;
      width: fit-content;
      margin: 0 auto 12px;
      padding: 6px 15px;
      border-radius: 50px;
      background: rgba(59, 130, 246, .15);
      border: 1px solid rgba(96, 165, 250, .35);
      color: #93c5fd;
      font-size: 13px;
    }

    h1 {
      position: relative;
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .subtitle {
      position: relative;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .diamond-box {
      position: relative;
      text-align: center;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 20px;
      background: linear-gradient(
        145deg,
        rgba(30, 64, 175, .28),
        rgba(15, 23, 42, .7)
      );
      border: 1px solid rgba(96, 165, 250, .25);
    }

    .diamond-img {
      width: 170px;
      max-width: 70%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(59, 130, 246, .65));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .amount {
      margin-top: 8px;
      font-size: 38px;
      line-height: 1;
      font-weight: 800;
      color: #60a5fa;
      text-shadow: 0 0 20px rgba(59, 130, 246, .5);
    }

    .amount span {
      font-size: 24px;
    }

    .reward {
      color: #cbd5e1;
      font-size: 13px;
      margin-top: 6px;
    }

    .form-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .input {
      width: 100%;
      height: 54px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #080d1c;
      color: white;
      padding: 0 16px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: .2s;
    }

    .input::placeholder {
      color: #64748b;
    }

    .input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
    }

    .button {
      width: 100%;
      height: 55px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 10px 25px rgba(37, 99, 235, .25);
      transition: .2s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, .35);
    }

    .button:active {
      transform: scale(.98);
    }

    .notice {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(30, 41, 59, .65);
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(34, 197, 94, .08);
      border: 1px solid rgba(34, 197, 94, .25);
    }

    .result.show {
      display: block;
    }

    .result-title {
      color: #4ade80;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .result p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .uid-value {
      color: white;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="badge">🎁 กิจกรรมพิเศษ</div>

      <h1>แจกเพชรฟรี</h1>

      <div class="subtitle">
        กรอก UID เพื่อเข้าร่วมกิจกรรม
      </div>

      <!-- รูปเพชร -->
      <div class="diamond-box">

        <img
          class="diamond-img"
          src="https://i.ibb.co/SDFZYqDP/57-FC00-F1-DA29-45-D2-B7-A0-C73-DE3-DB7760.png"
          alt="Free Fire Diamonds"
        >

        <div class="amount">
          5,100 <span>💎</span>
        </div>

        <div class="reward">
          รางวัลกิจกรรมแจกเพชรฟรี
        </div>

      </div>

      <!-- กรอก UID -->
      <div class="form-title">
        🎮 UID เกมของคุณ
      </div>

      <input
        id="uid"
        class="input"
        type="text"
        inputmode="numeric"
        maxlength="20"
        placeholder="กรอก UID Free Fire"
      >

      <button class="button" onclick="submitUID()">
        ดำเนินการต่อ →
      </button>

      <div class="notice">
        กรุณาตรวจสอบ UID ให้ถูกต้องก่อนดำเนินการต่อ
      </div>

      <!-- ผลลัพธ์ -->
      <div id="result" class="result">

        <div class="result-title">
          ✅ รับข้อมูลเรียบร้อย
        </div>

        <p>
          UID:
          <span id="uidResult" class="uid-value"></span>
        </p>

        <p>
          รางวัล:
          <span class="uid-value">5,100 💎</span>
        </p>

      </div>

    </section>

  </main>

  <script>
    function submitUID() {

      const uidInput = document.getElementById("uid");
      const uid = uidInput.value.trim();

      if (!uid) {
        alert("กรุณากรอก UID ก่อน");
        uidInput.focus();
        return;
      }

      if (!/^[0-9]+$/.test(uid)) {
        alert("UID ต้องเป็นตัวเลขเท่านั้น");
        uidInput.focus();
        return;
      }

      document.getElementById("uidResult").textContent = uid;
      document.getElementById("result").classList.add("show");
    }
  </script>

</body>
</html>
